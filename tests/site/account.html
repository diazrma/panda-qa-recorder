<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Minha conta - Loja Demo</title>
<link rel="stylesheet" href="site.css"></head><body>
<header class="top"><a class="logo" href="home.html">Loja<span>Demo</span></a>
<nav><a href="home.html">Início</a><a href="produto.html?id=1">Camisetas</a><a href="produto.html?id=2">Calçados</a><a href="produto.html?id=3">Acessórios</a></nav>
<a class="login-link" href="login.html">Sair</a></header>
<main><div id="root" class="panel">Carregando...</div></main>
<script>
// Simula renderização tardia (AJAX/Knockout) e ids aleatórios a cada carga, como no checkout do Magento.
const rid = () => Math.random().toString(36).slice(2, 9).toUpperCase();
setTimeout(() => {
  const u = new URLSearchParams(location.search).get('u');
  const id = rid();
  document.getElementById('root').innerHTML = `
    <h1 class="welcome">Bem-vindo, ${u}</h1>
    <label for="${id}">Telefone</label><input id="${id}" name="telephone">
    <button type="button" id="${rid()}" class="save">Salvar</button>
    <p class="msg"></p>
    <a href="orders.html">Meus pedidos</a>`;
  document.querySelector('.save').addEventListener('click', () => {
    document.querySelector('.msg').textContent = 'Telefone salvo: ' + document.querySelector('[name=telephone]').value;
  });
}, 700);
</script></body></html>
