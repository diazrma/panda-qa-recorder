<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panda QA Admin</title>
<script>
  // Escuro por padrão; a escolha fica neste navegador.
  try { document.documentElement.dataset.theme = localStorage.getItem('pqa-tema') || 'dark'; } catch { document.documentElement.dataset.theme = 'dark'; }
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><circle cx='11' cy='13' r='4' fill='white'/><circle cx='21' cy='13' r='4' fill='white'/><circle cx='11' cy='13' r='2' fill='%23111'/><circle cx='21' cy='13' r='2' fill='%23111'/><ellipse cx='16' cy='22' rx='3' ry='2' fill='white'/></svg>">
<style>
  :root {
    --bg: #f5f6f8; --surface: #fff; --surface-2: #f0f2f5; --border: #e2e5ea; --text: #15181e; --muted: #626a77;
    --accent: #2563eb; --accent-soft: #e8efff; --ok: #15803d; --ok-soft: #e6f5ea; --fail: #c2261d; --fail-soft: #fdecea;
    --warn: #b45309; --warn-soft: #fff3df; --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .06);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --surface: #171a21; --surface-2: #1f232c; --border: #2b303b; --text: #e8eaef; --muted: #98a0ad;
      --accent: #5b8cff; --accent-soft: #1b2847; --ok: #4ade80; --ok-soft: #12291b; --fail: #f87171; --fail-soft: #361616;
      --warn: #fbbf24; --warn-soft: #33260c; --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --surface: #171a21; --surface-2: #1f232c; --border: #2b303b; --text: #e8eaef; --muted: #98a0ad;
    --accent: #5b8cff; --accent-soft: #1b2847; --ok: #4ade80; --ok-soft: #12291b; --fail: #f87171; --fail-soft: #361616;
    --warn: #fbbf24; --warn-soft: #33260c; --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; display: flex; align-items: center; gap: 10px; }
  header h1 small { font-weight: 500; color: var(--muted); font-size: 13px; }
  .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: #fff; font-weight: 800; }
  .btn { height: 32px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 550; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.small { height: 26px; padding: 0 9px; font-size: 12px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .grid { display: grid; gap: 14px; }
  .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .two { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
  .card h2 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .card h2 .sub { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: auto; }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .kpi .val { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; margin-top: 4px; }
  .kpi .hint { color: var(--muted); font-size: 12px; }
  section { margin-top: 22px; }
  section > .title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 0 0 10px; }
  .alert { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; padding: 12px 14px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--fail) 35%, transparent); background: var(--fail-soft); }
  .alert + .alert { margin-top: 8px; }
  .alert b { font-size: 15px; }
  .alert .meta { color: var(--muted); font-size: 13px; grid-column: 1; }
  .alert .act { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
  .pill { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 650; background: var(--surface-2); color: var(--muted); }
  .pill.site { background: var(--fail-soft); color: var(--fail); }
  .pill.teste { background: var(--accent-soft); color: var(--accent); }
  .pill.ambiente { background: var(--warn-soft); color: var(--warn); }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.bad { background: var(--fail-soft); color: var(--fail); }
  .empty { color: var(--muted); padding: 10px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 650; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  .heat { display: inline-block; width: 64px; height: 8px; border-radius: 4px; background: var(--surface-2); vertical-align: middle; overflow: hidden; margin-right: 6px; }
  .heat > i { display: block; height: 100%; }
  .bars { display: grid; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: 160px 1fr 34px; gap: 8px; align-items: center; font-size: 13px; }
  .bar-row .track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
  .bar-row .track > i { display: block; height: 100%; border-radius: 5px; }
  svg text { fill: var(--muted); font-size: 10px; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  .form label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  .form input, .form select { height: 32px; padding: 0 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); min-width: 0; }
  .login { max-width: 360px; margin: 14vh auto 0; }
  .login .card { display: grid; gap: 12px; }
  .login input { height: 38px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .err { color: var(--fail); font-size: 13px; min-height: 1.2em; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); }
  .round { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .round:last-child { border-bottom: 0; }
  .round .who { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .scroll { overflow-x: auto; }
  .filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
  .filtros label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  .filtros select { height: 32px; padding: 0 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); min-width: 180px; max-width: 100%; }
  details.ex { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  details.ex + details.ex { margin-top: 8px; }
  details.ex > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 14px; }
  details.ex > summary::-webkit-details-marker { display: none; }
  details.ex > summary::before { content: '▸'; color: var(--muted); grid-row: 1 / span 2; transition: transform .15s; }
  details.ex[open] > summary::before { transform: rotate(90deg); }
  details.ex .ex-nome { font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details.ex .ex-meta { grid-column: 2; color: var(--muted); font-size: 12px; }
  details.ex .ex-st { grid-row: 1 / span 2; grid-column: 3; }
  .ex-corpo { border-top: 1px solid var(--border); padding: 12px 14px; }
  .passos { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .passos li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px; border-radius: 8px; background: var(--surface-2); }
  .passos li.failed { background: var(--fail-soft); }
  .passos .n { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .passos .erro { color: var(--fail); font-size: 12px; margin-top: 2px; }
  .passos img { width: 150px; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; border-radius: 6px; border: 1px solid var(--border); cursor: zoom-in; display: block; }
  .passos img:hover { border-color: var(--accent); }
  dialog.viewer { width: min(1100px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); }
  dialog.viewer::backdrop { background: rgba(5, 7, 10, .6); }
  .viewer .v-head { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .viewer .v-head b { flex: 1; min-width: 0; }
  .viewer img { display: block; width: 100%; max-height: calc(100vh - 170px); object-fit: contain; background: #000; }
  .viewer .v-foot { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--border); }
  .viewer .v-foot span { margin-right: auto; color: var(--muted); font-size: 12px; }
  .sites-check { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0; font-size: 13px; }
  .sites-check label { display: inline-flex; gap: 6px; align-items: center; }
  .sites-check small { color: var(--muted); }
  @media (max-width: 560px) { .passos li { grid-template-columns: 22px minmax(0, 1fr); } .passos img { grid-column: 2; width: 100%; } .filtros label, .filtros select { width: 100%; } header { flex-wrap: wrap; } header h1 { flex-basis: 100%; } header h1 small { display: none; } }
  @media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .two { grid-template-columns: minmax(0, 1fr); } .bar-row { grid-template-columns: 110px 1fr 30px; } }
</style>
</head>
<body>
<div id="login" class="login wrap" hidden>
  <form class="card" id="login-form">
    <div style="display:flex;align-items:center;gap:10px"><span class="logo">P</span><b>Panda QA · Admin</b></div>
    <input type="password" id="senha" placeholder="Senha do admin" autocomplete="current-password" autofocus>
    <div class="err" id="login-err"></div>
    <button class="btn primary" type="submit">Entrar</button>
  </form>
</div>
<div id="app" class="wrap" hidden></div>
<div id="toast" class="toast" hidden></div>
<dialog id="viewer" class="viewer"></dialog>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const pct = (x) => (x == null ? '–' : `${(x * 100).toFixed(1).replace('.', ',')}%`);
const hora = (t) => new Date(t).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
const ORIGEM = { teste: 'Ajustar o teste', site: 'Problema no site', ambiente: 'Ambiente' };
let senha = '';
try { senha = sessionStorage.getItem('pqa-senha') || ''; } catch {}
let dados = null;
let chaveVisivel = '';
let filtro = { projeto: '', qa: '' };
try { filtro = { ...filtro, ...JSON.parse(localStorage.getItem('pqa-filtro') || '{}') }; } catch {}
let editandoProjeto = '';
const abertos = new Set();
const execCache = new Map();
const ST = { passed: ['ok', 'Passou'], healed: ['ok', 'Passou (corrigido)'], failed: ['bad', 'Falhou'], warning: ['ambiente', 'Aviso'], skipped: ['', 'Pulado'], pending: ['', 'Não executado'] };
const statusPill = (s) => `<span class="pill ${(ST[s] || ST.pending)[0]}">${(ST[s] || ST.pending)[1]}</span>`;
const dur = (ms) => `${((ms || 0) / 1000).toFixed(1).replace('.', ',')} s`;

function toast(t) {
  const el = $('#toast');
  el.textContent = t;
  el.hidden = false;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { el.hidden = true; }, 3000);
}

async function api(acao, extra = {}) {
  const r = await fetch('/api/admin', { method: 'POST', headers: { 'content-type': 'application/json', 'x-senha': senha }, body: JSON.stringify({ acao, ...extra }) });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { sair(); throw new Error(d.erro || 'Senha errada'); }
  if (!r.ok) throw new Error(d.erro || `Erro ${r.status}`);
  return d;
}

function sair() {
  senha = '';
  try { sessionStorage.removeItem('pqa-senha'); } catch {}
  $('#app').hidden = true;
  $('#login').hidden = false;
}

$('#login-form').onsubmit = async (e) => {
  e.preventDefault();
  senha = $('#senha').value;
  $('#login-err').textContent = '';
  try {
    await carregar();
    try { sessionStorage.setItem('pqa-senha', senha); } catch {}
  } catch (err) {
    $('#login-err').textContent = err.message;
  }
};

async function carregar() {
  dados = await api('painel', { filtro });
  const sumiuProjeto = filtro.projeto && filtro.projeto !== '-' && !(dados.config.projetos || {})[filtro.projeto];
  const sumiuQa = filtro.qa && !(dados.radar.qas || []).some((q) => q.id === filtro.qa);
  if (sumiuProjeto || sumiuQa) {
    filtro = { projeto: sumiuProjeto ? '' : filtro.projeto, qa: sumiuQa ? '' : filtro.qa };
    try { localStorage.setItem('pqa-filtro', JSON.stringify(filtro)); } catch {}
    dados = await api('painel', { filtro });
  }
  $('#login').hidden = true;
  $('#app').hidden = false;
  render();
}

// Mesmo apelido que a extensão calcula (lib/anon.js): "s" + FNV-1a do endereço, em base 36.
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function aliasDe(texto) {
  let t = String(texto || '').trim();
  if (!/^https?:\/\//i.test(t)) t = 'https://' + t;
  return 's' + fnv1a(new URL(t).origin.toLowerCase()).toString(36);
}

const qaNome = (id) => {
  const q = (dados.radar.qas || []).find((x) => x.id === id);
  const e = (dados.execucoes || []).find((x) => x.c === id && x.q);
  return q?.nome || e?.q || `QA anônimo · ${String(id).slice(0, 6)}`;
};

function secaoTestes() {
  const lista = dados.execucoes || [];
  if (!lista.length) {
    return `<div class="card"><div class="empty">${filtro.projeto || filtro.qa ? 'Nenhum teste enviado com este filtro.' : 'Nenhum teste enviado ainda. Na extensão, ligue "Enviar execuções para o painel do time" em Configurações > Time (e "Print de cada passo" para ver as telas).'}</div></div>`;
  }
  return lista.map((e) => `<details class="ex" data-ex="${esc(e.id)}" ${abertos.has(e.id) ? 'open' : ''}>
    <summary><span class="ex-nome">${esc(e.nome)}</span>
      <span class="ex-st">${statusPill(e.status)}</span>
      <span class="ex-meta">${esc(qaNome(e.c))} · ${e.projeto && !nomeSite(e.s).startsWith(nomeProjeto(e.projeto)) ? esc(nomeProjeto(e.projeto)) + ' · ' : ''}${esc(nomeSite(e.s) || 'sem site')} · ${hora(e.at)} · ${dur(e.ms)} · ${e.passos} passos${e.prints ? ` · ${e.prints} print(s)` : ''}${e.status === 'failed' && e.falhou >= 0 ? ` · falhou no passo ${e.falhou + 1}` : ''}</span></summary>
    <div class="ex-corpo">${abertos.has(e.id) ? corpoExecucao(e) : ''}</div>
  </details>`).join('');
}

function corpoExecucao(e) {
  const ex = execCache.get(e.id);
  if (!ex || ex.at !== e.at) return '<div class="empty">Carregando…</div>';
  return `${ex.erro ? `<div class="alert" style="grid-template-columns:1fr;margin-bottom:10px"><div><b>Passo ${ex.falhou + 1}</b> · ${esc(ex.erro)}</div></div>` : ''}
    ${ex.messages?.length ? `<div style="margin-bottom:10px;font-size:13px"><b>Mensagens na página:</b> ${ex.messages.map(esc).join(' · ')}</div>` : ''}
    <ol class="passos">${ex.steps.map((s, i) => {
      const r = ex.results[i] || {};
      return `<li class="${esc(r.status || '')}"><span class="n">${i + 1}</span>
        <div><div>${esc(ex.descs?.[i] || s.type)}</div><div style="margin-top:3px">${statusPill(r.status)}${r.ms != null ? ` <span class="pill">${dur(r.ms)}</span>` : ''}</div>${r.error ? `<div class="erro">${esc(r.error)}</div>` : ''}</div>
        ${ex.shots[i] ? `<img src="${ex.shots[i]}" alt="Tela depois do passo ${i + 1}" data-a="ver-print" data-id="${esc(e.id)}" data-i="${i}" loading="lazy">` : ''}</li>`;
    }).join('')}</ol>
    <div class="row-actions" style="margin-top:12px">${Object.keys(ex.shots).length ? `<button class="btn small primary" data-a="ver-print" data-id="${esc(e.id)}" data-i="${Object.keys(ex.shots)[0]}">Ver passo a passo</button>` : '<span style="color:var(--muted);font-size:13px">Sem prints: na extensão, ligue "Print de cada passo" em Configurações.</span>'}
      <button class="btn small" data-a="execucao-del" data-id="${esc(e.id)}" style="margin-left:auto">Remover do painel</button></div>`;
}

async function abrirExecucao(det) {
  const id = det.dataset.ex;
  const e = (dados.execucoes || []).find((x) => x.id === id);
  if (!e) return;
  if (!execCache.has(id) || execCache.get(id).at !== e.at) {
    try { execCache.set(id, await api('execucao', { id })); } catch (err) { det.querySelector('.ex-corpo').innerHTML = `<div class="empty">${esc(err.message)}</div>`; return; }
  }
  det.querySelector('.ex-corpo').innerHTML = corpoExecucao(e);
}

function verPrints(id, inicio) {
  const ex = execCache.get(id);
  const idx = Object.keys(ex.shots).map(Number).sort((a, b) => a - b);
  let pos = Math.max(0, idx.indexOf(inicio));
  const dlg = $('#viewer');
  const pintar = () => {
    const i = idx[pos];
    const r = ex.results[i] || {};
    dlg.innerHTML = `<div class="v-head"><b>${esc(ex.nome)} · passo ${i + 1} de ${ex.steps.length}</b>${statusPill(r.status)}<button class="btn small" data-v="fechar">Fechar</button></div>
      <div style="padding:8px 14px;font-size:13px;border-bottom:1px solid var(--border)">${esc(ex.descs?.[i] || ex.steps[i].type)}${r.error ? `<div style="color:var(--fail)">${esc(r.error)}</div>` : ''}</div>
      <img src="${ex.shots[i]}" alt="Tela depois do passo ${i + 1}">
      <div class="v-foot"><span>${pos + 1} / ${idx.length} · use ← → do teclado</span><button class="btn" data-v="-1" ${pos ? '' : 'disabled'}>← Anterior</button><button class="btn" data-v="1" ${pos < idx.length - 1 ? '' : 'disabled'}>Próximo →</button></div>`;
  };
  const ir = (d) => { pos = Math.min(idx.length - 1, Math.max(0, pos + d)); pintar(); };
  dlg.onclick = (ev) => {
    if (ev.target === dlg) return dlg.close();
    const b = ev.target.closest('[data-v]');
    if (!b) return;
    if (b.dataset.v === 'fechar') dlg.close();
    else ir(Number(b.dataset.v));
  };
  dlg.onkeydown = (ev) => { if (ev.key === 'ArrowRight') ir(1); if (ev.key === 'ArrowLeft') ir(-1); };
  pintar();
  dlg.showModal();
}
const nomeSite = (alias) => (dados.config.sites || {})[alias] || alias;
const nomeProjeto = (id) => (dados.config.projetos || {})[id]?.nome || '';

function barraDeFiltros() {
  const projetos = Object.entries(dados.config.projetos || {}).sort((a, b) => a[1].nome.localeCompare(b[1].nome, 'pt-BR'));
  const qas = [...(dados.radar.qas || [])];
  for (const e of dados.execucoes || []) if (!qas.some((q) => q.id === e.c)) qas.push({ id: e.c, nome: e.q, execucoes: 0 });
  const ativo = filtro.projeto || filtro.qa;
  return `<div class="filtros">
    <label>Projeto<select data-filtro="projeto">
      <option value="">Todos os projetos</option>
      ${projetos.map(([id, p]) => `<option value="${esc(id)}" ${filtro.projeto === id ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}
      <option value="-" ${filtro.projeto === '-' ? 'selected' : ''}>Sites sem projeto</option>
    </select></label>

function cartaoProjetos() {

  const todosSites = [...new Set([...Object.keys(dados.config.sites || {}), ...(dados.radar.sitesVistos || []), ...usados])]
    .sort((a, b) => nomeSite(a).localeCompare(nomeSite(b), 'pt-BR'));

  return `<div class="card" style="margin-bottom:14px"><h2>Projetos<span class="sub">agrupam os sites de um cliente (local, staging, produção); site novo entra sozinho no projeto do domínio</span></h2>

        ${ed ? '<button class="btn" type="button" data-a="projeto-cancelar">Cancelar</button>' : ''}</div>
      ${todosSites.length ? `<div class="sites-check">${todosSites.map((s) => {

        return `<label><input type="checkbox" name="site" value="${esc(s)}" ${(ed?.sites || []).includes(s) ? 'checked' : ''}>${esc(nomeSite(s))}${outro ? ` <small>(hoje em ${esc(outro[1].nome)})</small>` : ''}</label>`;

  </div>`;
}

const corTaxa = (t) => (t >= 0.5 ? 'var(--fail)' : t >= 0.2 ? 'var(--warn)' : 'var(--ok)');

function linhaDoTempo(linha) {
  const W = 720, H = 140, pad = 22;
  const max = Math.max(1, ...linha.map((h) => h.total));
  const bw = (W - pad) / linha.length;
  const bars = linha.map((h, i) => {
    const x = pad + i * bw;
    const ht = (h.total / max) * (H - 30);
    const hf = (h.falhas / max) * (H - 30);
    return `<rect x="${x + 1}" y="${H - 18 - ht}" width="${bw - 2}" height="${ht}" rx="2" fill="var(--accent)" opacity=".28"><title>${hora(h.at)}: ${h.total} execuções, ${h.falhas} falhas</title></rect>
      <rect x="${x + 1}" y="${H - 18 - hf}" width="${bw - 2}" height="${hf}" rx="2" fill="var(--fail)"><title>${hora(h.at)}: ${h.falhas} falhas</title></rect>`;
  }).join('');
  const marcas = [0, 12, 24, 36, 47].map((i) => `<text x="${i === 47 ? W : pad + i * bw}" y="${H - 4}" text-anchor="${i === 47 ? 'end' : 'start'}">${new Date(linha[i].at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Execuções e falhas por hora nas últimas 48 horas">
    <text x="0" y="12">${max}</text><line x1="${pad}" x2="${W}" y1="${H - 18}" y2="${H - 18}" stroke="var(--border)"/>${bars}${marcas}</svg>
    <div class="row-actions" style="font-size:12px;color:var(--muted)"><span class="pill" style="background:color-mix(in srgb,var(--accent) 28%,transparent)">execuções</span><span class="pill bad">falhas</span></div>`;
}

function graficoVersoes(versoes, atual) {
  if (versoes.length < 2) return '<div class="empty">O gráfico aparece a partir da segunda versão do modelo.</div>';
  const W = 520, H = 150, p = 30;
  const accs = versoes.map((v) => v.acuracia);
  const lo = Math.max(0, Math.min(...accs) - 0.02), hi = Math.min(1, Math.max(...accs) + 0.01);
  const x = (i) => p + (i / (versoes.length - 1)) * (W - p - 10);
  const y = (a) => 10 + (1 - (a - lo) / (hi - lo || 1)) * (H - 40);
  const pts = versoes.map((v, i) => `${x(i)},${y(v.acuracia)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Acerto do modelo por versão">
    <text x="0" y="${y(hi) + 4}">${pct(hi)}</text><text x="0" y="${y(lo) + 4}">${pct(lo)}</text>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${versoes.map((v, i) => `<circle cx="${x(i)}" cy="${y(v.acuracia)}" r="${v.versao === atual ? 5 : 3.5}" fill="${v.versao === atual ? 'var(--accent)' : 'var(--surface)'}" stroke="var(--accent)" stroke-width="2"><title>v${v.versao}: ${pct(v.acuracia)}</title></circle>
      <text x="${x(i) - 6}" y="${H - 8}">v${v.versao}</text>`).join('')}
  </svg>`;
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a;
  try {
    if (a === 'sair') return sair();
    if (a === 'tema') {
      const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      try { localStorage.setItem('pqa-tema', t); } catch {}
      return render();
    }
    if (a === 'projeto-editar' || a === 'projeto-cancelar') {
      editandoProjeto = a === 'projeto-editar' ? b.dataset.id : '';
      render();
      if (editandoProjeto) $('#projeto-form').scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if (a === 'ver-print') return verPrints(b.dataset.id, Number(b.dataset.i));
    if (a === 'limpar-filtro') {
      filtro = { projeto: '', qa: '' };
      try { localStorage.removeItem('pqa-filtro'); } catch {}
    }
    b.disabled = true;
    if (a === 'ativar' && confirm(`Colocar a v${b.dataset.versao} como modelo do time? As extensões baixam em até 15 min.`)) { await api('ativar', { versao: Number(b.dataset.versao) }); toast(`v${b.dataset.versao} em uso.`); }
    if (a === 'rodada') { const r = await api('rodada'); toast(r.publicado ? `Rodada fechada: v${r.publicado} publicada.` : `Rodada fechada sem publicar: ${r.motivo}`); }
    if (a === 'descartar') { await api('descartar', { id: b.dataset.id }); toast('Contribuição descartada.'); }
    if (a === 'bug') { const bug = await api('bug', { chave: b.dataset.chave }); toast('Bug aberto no ClickUp.'); window.open(bug.url, '_blank'); }
    if (a === 'site-del') await api('site', { alias: b.dataset.alias, nome: '' });
    if (a === 'execucao-del') {
      if (!confirm('Remover esta execução do painel? A extensão manda de novo na próxima execução do teste.')) { b.disabled = false; return; }
      await api('execucaoDel', { id: b.dataset.id });
      abertos.delete(b.dataset.id);
      toast('Execução removida.');
    }
    if (a === 'projeto-del') {
      if (!confirm(`Remover o projeto ${nomeProjeto(b.dataset.id)}? Os sites continuam, só ficam sem projeto.`)) { b.disabled = false; return; }
      await api('projeto', { id: b.dataset.id, nome: '' });
      if (filtro.projeto === b.dataset.id) filtro = { ...filtro, projeto: '' };
      toast('Projeto removido.');
    }
    if (a === 'resetar') {
      const confirmou = confirm('Isso é irreversível: o histórico do aprendizado, contribuições, rodadas, dados do radar, execuções dos testes e nomes de sites serão apagados. O modelo base será publicado novamente. Os testes nas extensões não serão apagados. Continuar?');
      if (!confirmou) { b.disabled = false; return; }
      const resultado = await api('resetar');
      chaveVisivel = '';
      toast(`Reset concluído: modelo base v${resultado.aprendizado.versao} publicado; dados do radar e sites limpos.`);
    }
    if (a === 'chave-ver') {
      chaveVisivel = chaveVisivel ? '' : (await api('chave')).chave;
      return render();
    }
    if (a === 'chave-copiar') {
      await navigator.clipboard.writeText((await api('chave')).chave);
      b.disabled = false;
      return toast('Chave copiada.');
    }
    if (a === 'chave-trocar') {
      if (!confirm('Gerar uma chave nova? A atual para de funcionar na hora: cada QA vai precisar colar a nova na extensão.')) { b.disabled = false; return; }
      chaveVisivel = (await api('trocarChave')).chave;
      toast('Chave nova gerada. Passe para o time.');
    }
    await carregar();
  } catch (err) {
    toast(err.message);
    b.disabled = false;
  }
});

if (senha) carregar().catch(() => sair());
else sair();
// Não recarrega enquanto alguém digita num formulário: o render apagaria o que foi digitado.
const digitando = () => Boolean(editandoProjeto || abertos.size || $('#viewer').open || document.activeElement?.closest('form'));
setInterval(() => { if (senha && !document.hidden && !digitando()) carregar().catch(() => {}); }, 60000);
</script>
</body>
</html>
